name: tracking-scraper

services:
  tracking:
    build:
      context: ../..
      dockerfile: scraper/tencent/Dockerfile.tracking
    restart: unless-stopped
    environment:
      PORT: "8081"
      SCRAPER_BASE_URL: https://scraper.43.167.252.197.sslip.io
      SCRAPER_TOKEN: ${SCRAPER_TOKEN:?set_in_private_env_file}
    expose:
      - "8081"
    networks:
      evo:
        aliases:
          - tracking-app
    logging:
      options: {max-size: "10m", max-file: "3"}
  scraper:
    image: ghcr.io/plhery/universal-parcel-scraper:0.637.1
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      SCRAPER_TOKEN: ${SCRAPER_TOKEN:?set_in_private_env_file}
      SCRAPER_MAX_CONCURRENT: "2"
      SCRAPER_RATE_LIMIT: "20"
      SCRAPER_CACHE_MS: "600000"
      FLARESOLVERR_URL: http://tracking-trawl:8191
    expose:
      - "8080"
    networks:
      evo:
        aliases:
          - tracking-scraper
    logging:
      options: {max-size: "10m", max-file: "3"}
  trawl:
    image: ghcr.io/plhery/universal-parcel-scraper-trawl:0.495.1
    restart: unless-stopped
    shm_size: "256m"
    mem_limit: "1400m"
    environment:
      LOG_LEVEL: warn
    expose:
      - "8191"
    networks:
      evo:
        aliases:
          - tracking-trawl
    logging:
      options: {max-size: "10m", max-file: "3"}

networks:
  evo:
    external: true
    name: ${EVO_NETWORK:-evo-tokyo-dev_internal}
